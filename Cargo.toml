[package]
name = "ftx-cert-build"
version = "0.2.0"
authors = ["Fortanix, Inc."]
edition = "2021"
description = "Builder for certificates, TBS certificates, and CSRs, implemented as a wrapper around the pkix crate."

[dependencies]
chrono = { version = "0.4.23", default-features = false }
mbedtls = { version = ">=0.12.0, <0.14.0", default-features = false, features = ["rdrand", "std"], optional = true }
pkix = "0.2.2"
serde = { version = "1.0.113", features = ["derive"], optional = true }
thiserror = "1.0.2"
rustls = { version = "0.23", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
aws-lc-rs = { version = "1.18", default-features = false, optional = true }
getrandom = { version = "0.4", optional = true }

[features]
default = ["ecdsaecdh", "rsa"]

ecdsaecdh = []
mbedtls_adapter = ["dep:mbedtls"]
rustls_adapter = ["dep:rustls", "dep:rustls-pki-types", "dep:aws-lc-rs", "dep:getrandom"]
rsa = []
# Add serde::Serialize and serde:Deserialize bound to data types.
# If you'd like to use `serde` to serialize certs/csrs.
serde = ["dep:serde"]
