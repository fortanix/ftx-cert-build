[package]
name = "ftx-cert-build"
version = "0.1.0"
authors = ["Fortanix, Inc."]
edition = "2021"
description = "Builder for certificates, TBS certificates, and CSRs, implemented as a wrapper around the pkix crate."

[dependencies]
chrono = { version = "0.4", default-features = false }
mbedtls = { version = ">=0.12.0, <0.14.0", default-features = false, features = ["rdrand", "std"] }
pkix = ">=0.1.2, <0.3.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_derive = { version = "1.0", optional = true }
thiserror = "1.0"

[features]
default = ["ecdsaecdh", "rsa"]

ecdsaecdh = []
mbedtls_adapter = []
rsa = []
# Add serde::Serialize and serde:Deserialize bound to data types.
# If you'd like to use `serde` to serialize certs/csrs.
serde = ["dep:serde", "dep:serde_derive"]
